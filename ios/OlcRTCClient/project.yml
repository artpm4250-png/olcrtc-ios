name: OlcRTCClient
options:
  bundleIdPrefix: org.openlibrecommunity.olcrtc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # Unsigned build path — see ADR-0008 in docs/ai/DECISIONS.md.
    # Real-device VPN runtime requires a paid Apple Developer account,
    # provisioning profile scoped to the PacketTunnelProvider, and the
    # com.apple.developer.networking.networkextension entitlement.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
# App Group shared between OlcRTCClient and PacketTunnelProvider:
#   group.org.openlibrecommunity.olcrtc.client
# Declared in both `.entitlements` files (OlcRTCClient.entitlements
# and PacketTunnelProvider.entitlements). The constant lives in
# `Sources/Shared/Services/AppGroup.swift`; the read/write surface is
# `Sources/Shared/Services/SharedConfigStore.swift` (config) and
# `Sources/Shared/Services/SharedLogStore.swift` (log mirror).
#
# CODE_SIGN_ENTITLEMENTS is intentionally NOT attached to either
# target in this configuration. The unsigned CI build path
# (CODE_SIGNING_ALLOWED=NO above) cannot grant the App Group
# entitlement at runtime, so `AppGroup.containerURL()` returns nil
# in CI / unsigned builds and the shared stores degrade to no-ops
# (Stage 3 / Milestone 3.5 unsigned-safe contract).
#
# When a signing identity becomes available (Milestone 2 / 4),
# attach both files via:
#   - OlcRTCClient target:        CODE_SIGN_ENTITLEMENTS: Sources/App/OlcRTCClient.entitlements
#   - PacketTunnelProvider target: CODE_SIGN_ENTITLEMENTS: Sources/PacketTunnelProvider/PacketTunnelProvider.entitlements
# and flip the global CODE_SIGNING_ALLOWED back to YES.
targets:
  OlcRTCClient:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: olcRTC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - olcrtc
        CFBundleURLTypes:
          - CFBundleURLName: org.openlibrecommunity.olcrtc.url
            CFBundleURLSchemes:
              - olcrtc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client
        # Entitlements are intentionally NOT attached in the current
        # unsigned CI build path. `Sources/App/OlcRTCClient.entitlements`
        # is kept in the repo as a future-signing reference (App Group +
        # com.apple.developer.networking.networkextension). When a
        # signing identity is configured later (see ADR-0008), set:
        #   CODE_SIGN_ENTITLEMENTS: Sources/App/OlcRTCClient.entitlements
        # and flip the global CODE_SIGNING_ALLOWED back to YES.
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed).
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # OlcRTCMobile pulls Go runtime/stdlib code that references the
        # BSD resolver symbols `_res_9_nclose`, `_res_9_ninit`, and
        # `_res_9_nsearch`. On iOS those live in `libresolv.tbd`, which
        # is not linked by default. Link it explicitly here so the Debug
        # iphonesimulator and Release iphoneos builds resolve those
        # symbols. See `docs/ai/TASK_LOG.md` and section "libresolv" in
        # `docs/ai/GOMOBILE_BINDINGS.md`.
        OTHER_LDFLAGS: $(inherited) -lresolv
    dependencies:
      - target: PacketTunnelProvider
        embed: true
        codeSign: false
      # OlcRTCMobile.xcframework is generated by scripts/build-gomobile-ios.sh
      # and placed at ios/OlcRTCClient/Frameworks/OlcRTCMobile.xcframework.
      # It is gitignored (see .gitignore) and must not be committed. The
      # framework is only linked into the main app target for now; the
      # PacketTunnelProvider extension will be wired in a later step once
      # APPLICATION_EXTENSION_API_ONLY compatibility is validated.
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: true
        codeSign: false
  PacketTunnelProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/PacketTunnelProvider
      - path: Sources/Shared
    info:
      path: Sources/PacketTunnelProvider/Info.plist
      properties:
        CFBundleDisplayName: olcRTC Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.PacketTunnelProvider
        # Entitlements detached for the unsigned CI build path — see the
        # main app target comment above and ADR-0008. The
        # `PacketTunnelProvider.entitlements` file is kept as a
        # future-signing reference and gets attached when a signing
        # identity is configured.
        APPLICATION_EXTENSION_API_ONLY: YES
        # Framework search path for OlcRTCMobile.xcframework. Same value as
        # the host app — both targets look in the same Frameworks/ dir.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # Milestone 3.5 (branch `packet-tunnel-runtime-skeleton`), per
        # ADR-0013. `OlcRTCMobile.xcframework` is a static framework
        # wrapper (`.framework/<name>` is a `current ar archive`, not a
        # Mach-O dylib). Embedding via `embed: true` is destructive
        # (Xcode runs `builtin-copy -remove-static-executable` and
        # injects a codeless stub — confirmed by probes v10/v11).
        # Link-only without `-force_load` is also destructive
        # (ld_prime's `-dead_strip` removes the unused-dylib load
        # command — confirmed by probes v2–v9). The working shape is
        # link-only + `-force_load` of the slice's static archive
        # (probe v12, classification `PASS-STATIC-LINKED`).
        #
        # The v12 path was hard-coded to `ios-arm64/`, which works for
        # the `iphoneos` Release generic build the probe ran, but
        # breaks the simulator slice that `iOS App + Gomobile Build`
        # also builds (`ld: warning: ignoring file …ios-arm64/… : fat
        # file missing arch 'x86_64'`). Milestone 3.5 fixes that with
        # sdk-aware variants: `OTHER_LDFLAGS[sdk=iphoneos*]` picks the
        # `ios-arm64` slice, `OTHER_LDFLAGS[sdk=iphonesimulator*]`
        # picks the `ios-arm64_x86_64-simulator` slice. Both keep
        # `-lresolv` because the Go runtime references the BSD
        # resolver symbols `_res_9_n{init,close,search}` regardless of
        # slice.
        #
        # We deliberately do NOT use `-all_load`; force-load is scoped
        # to the one archive that needs it.
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) -lresolv -force_load $(SRCROOT)/Frameworks/OlcRTCMobile.xcframework/ios-arm64/OlcRTCMobile.framework/OlcRTCMobile
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(inherited) -lresolv -force_load $(SRCROOT)/Frameworks/OlcRTCMobile.xcframework/ios-arm64_x86_64-simulator/OlcRTCMobile.framework/OlcRTCMobile
    dependencies:
      # `OlcRTCMobile.xcframework` is a static framework wrapper (see
      # ADR-0013). Use a link-only dependency: XcodeGen adds the
      # framework to *Link Binary With Libraries* and exposes its
      # `Modules/` so `import OlcRTCMobile` resolves in the Swift
      # compile step, but no Copy Files (Embed Frameworks) phase is
      # generated for the extension. The actual symbol pull is done
      # by `-force_load` in `OTHER_LDFLAGS[sdk=…]*` above. The
      # extension `.appex` therefore has no `Frameworks/OlcRTCMobile.framework`
      # directory at all (no codeless stub, nothing to inject into);
      # the Go runtime's object files live inside the extension's
      # own executable. `codeSign: false` keeps any residual copy
      # step from trying to re-sign the framework under the unsigned
      # CI path (`CODE_SIGNING_ALLOWED=NO`).
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: false
        link: true
        codeSign: false
  OlcRTCClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/OlcRTCClientTests
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.tests
schemes:
  OlcRTCClient:
    build:
      targets:
        OlcRTCClient: all
        PacketTunnelProvider: all
    test:
      targets:
        - OlcRTCClientTests
