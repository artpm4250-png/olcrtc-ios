name: OlcRTCClient
options:
  bundleIdPrefix: org.openlibrecommunity.olcrtc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # Unsigned build path — see ADR-0008 in docs/ai/DECISIONS.md.
    # Real-device VPN runtime requires a paid Apple Developer account,
    # provisioning profile scoped to the PacketTunnelProvider, and the
    # com.apple.developer.networking.networkextension entitlement.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  OlcRTCClient:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: olcRTC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - olcrtc
        CFBundleURLTypes:
          - CFBundleURLName: org.openlibrecommunity.olcrtc.url
            CFBundleURLSchemes:
              - olcrtc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client
        # Entitlements are intentionally NOT attached in the current
        # unsigned CI build path. `Sources/App/OlcRTCClient.entitlements`
        # is kept in the repo as a future-signing reference (App Group +
        # com.apple.developer.networking.networkextension). When a
        # signing identity is configured later (see ADR-0008), set:
        #   CODE_SIGN_ENTITLEMENTS: Sources/App/OlcRTCClient.entitlements
        # and flip the global CODE_SIGNING_ALLOWED back to YES.
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed).
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # OlcRTCMobile pulls Go runtime/stdlib code that references the
        # BSD resolver symbols `_res_9_nclose`, `_res_9_ninit`, and
        # `_res_9_nsearch`. On iOS those live in `libresolv.tbd`, which
        # is not linked by default. Link it explicitly here so the Debug
        # iphonesimulator and Release iphoneos builds resolve those
        # symbols. See `docs/ai/TASK_LOG.md` and section "libresolv" in
        # `docs/ai/GOMOBILE_BINDINGS.md`.
        OTHER_LDFLAGS: $(inherited) -lresolv
    dependencies:
      - target: PacketTunnelProvider
        embed: true
        codeSign: false
      # OlcRTCMobile.xcframework is generated by scripts/build-gomobile-ios.sh
      # and placed at ios/OlcRTCClient/Frameworks/OlcRTCMobile.xcframework.
      # It is gitignored (see .gitignore) and must not be committed. The
      # framework is only linked into the main app target for now; the
      # PacketTunnelProvider extension will be wired in a later step once
      # APPLICATION_EXTENSION_API_ONLY compatibility is validated.
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: true
        codeSign: false
  PacketTunnelProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/PacketTunnelProvider
      - path: Sources/Shared
    info:
      path: Sources/PacketTunnelProvider/Info.plist
      properties:
        CFBundleDisplayName: olcRTC Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.PacketTunnelProvider
        # Entitlements detached for the unsigned CI build path — see the
        # main app target comment above and ADR-0008. The
        # `PacketTunnelProvider.entitlements` file is kept as a
        # future-signing reference and gets attached when a signing
        # identity is configured.
        APPLICATION_EXTENSION_API_ONLY: YES
        # Probe v7: disable LTO for this target only. Probe v6
        # (`docs/ai/TASK_LOG.md` — `2026-05-29 — Probe v6 result`)
        # showed that the gomobile undef references reach the
        # extension's per-translation-unit `.o` files (both
        # `PacketTunnelProvider.o` and
        # `GomobileExtensionLinkAnchor.o` carry `U _MobileIsRunning`
        # and `U _MobileSetDebug`), but ld_prime's whole-program
        # LTO pass on `iphoneos` Release nullifies the initializer
        # relocations against `_MobileIsRunning` / `_MobileSetDebug`
        # in the static function-pointer variables — the storage
        # survives, the relocations do not. Six iterations of
        # per-TU + linker-flag defenses (`__attribute__((used))`,
        # `volatile`, `optnone`, `-Wl,-u`, `-Wl,-needed_framework`,
        # static function-pointer initializers) failed to keep the
        # OlcRTCMobile load command past LTO. v7 attacks the LTO
        # layer directly: setting `LLVM_LTO = NO` for the
        # extension target removes `-flto=*` from clang and
        # `-object_path_lto …PacketTunnelProvider_lto.o` from the
        # ld command, so the link runs in the classic non-LTO
        # path. The host app target is unchanged — only the
        # extension drops LTO, and the gomobile xcframework's own
        # link footprint is untouched.
        LLVM_LTO: NO
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed). Same value as
        # the host app — both targets look in the same Frameworks/ dir.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # Probe step (branch `packet-tunnel-gomobile-probe`): the Go
        # runtime inside OlcRTCMobile references the BSD resolver
        # symbols `_res_9_n{init,close,search}`, which live in
        # `libresolv.tbd` on iOS and are not linked by default. The host
        # app already links it explicitly (see above) for the same
        # reason; mirror it here so the extension's linker resolves the
        # same symbols.
        #
        # `-Wl,-u,_OlcRTCExtensionGomobileLinkAnchor` tells ld to keep
        # the C anchor symbol defined in
        # `Sources/PacketTunnelProvider/GomobileExtensionLinkAnchor.m`
        # in the final binary regardless of whether anything in Swift
        # refers to it. The anchor file itself carries the actual
        # `OlcRTCMobile` link edge: it stores `MobileIsRunning` and
        # `MobileSetDebug` into `static volatile` function-pointer
        # variables annotated with `__attribute__((used))`, which
        # forces clang to emit Mach-O relocations against
        # `_MobileIsRunning` and `_MobileSetDebug` — see the file
        # header for the full chain. With `LLVM_LTO = NO` (above)
        # those relocations now reach the final binary's bind table
        # because there is no whole-program ld_prime pass to fold
        # them away.
        #
        # History (see `docs/ai/TASK_LOG.md` for the full chain):
        #   v2 used a Swift `private let` calling `MobileIsRunning`
        #   — eliminated by Swift WMO.
        #   v3 added `-Wl,-u,_MobileIsRunning` — ld dead-stripped
        #   the framework anyway.
        #   v4 added `-Wl,-needed_framework,OlcRTCMobile` —
        #   ld_prime allowed the trailing `-framework OlcRTCMobile`
        #   (XcodeGen-injected) to shadow the `needed` flag.
        #   v5 moved the anchor to a C function with
        #   `__attribute__((used))` — the symbol survived but
        #   LTO + `-Os` folded its body.
        #   v6 made the anchor's gomobile references data
        #   relocations via static function-pointer initializers
        #   plus `volatile` + `optnone` — the .o files had the
        #   refs but LTO still folded the data relocations.
        #   v7 (this configuration) keeps the v6 C anchor
        #   verbatim and disables LTO at the target level.
        OTHER_LDFLAGS: $(inherited) -lresolv -Wl,-u,_OlcRTCExtensionGomobileLinkAnchor
    dependencies:
      # `OlcRTCMobile.xcframework` linked into the extension target as a
      # COMPILE / LINK probe only (branch
      # `packet-tunnel-gomobile-probe`, see ADR-0006 and Milestone 3 in
      # `docs/ROADMAP.md`). `embed: false` so the framework is NOT
      # double-embedded — the host app already owns the bundled binary
      # under its own `Frameworks/` and the extension uses the same
      # copy at runtime via the bundle search path. `link: true` is
      # required to make the symbols available to the extension's
      # compile/link step.
      #
      # We deliberately do NOT run any olcRTC network code from the
      # extension yet (no MobileStart / MobileStartWithTransport /
      # MobileCheck / MobilePing call from the extension's startTunnel).
      # The only consumer is `GomobileExtensionProbe.swift`, which
      # references `MobileIsRunning` and `MobileSetDebug(false)` so the
      # symbols actually get linked — that proves the extension target
      # can link against OlcRTCMobile under
      # `APPLICATION_EXTENSION_API_ONLY = YES`. Real `startTunnel`
      # wiring stays gated on Milestone 4 (signed build + real VPN
      # runtime).
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: false
        codeSign: false
        link: true
  OlcRTCClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/OlcRTCClientTests
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.tests
schemes:
  OlcRTCClient:
    build:
      targets:
        OlcRTCClient: all
        PacketTunnelProvider: all
    test:
      targets:
        - OlcRTCClientTests
