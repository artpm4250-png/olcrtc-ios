name: OlcRTCClient
options:
  bundleIdPrefix: org.openlibrecommunity.olcrtc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # Unsigned build path — see ADR-0008 in docs/ai/DECISIONS.md.
    # Real-device VPN runtime requires a paid Apple Developer account,
    # provisioning profile scoped to the PacketTunnelProvider, and the
    # com.apple.developer.networking.networkextension entitlement.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  OlcRTCClient:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: olcRTC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - olcrtc
        CFBundleURLTypes:
          - CFBundleURLName: org.openlibrecommunity.olcrtc.url
            CFBundleURLSchemes:
              - olcrtc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client
        # Entitlements are intentionally NOT attached in the current
        # unsigned CI build path. `Sources/App/OlcRTCClient.entitlements`
        # is kept in the repo as a future-signing reference (App Group +
        # com.apple.developer.networking.networkextension). When a
        # signing identity is configured later (see ADR-0008), set:
        #   CODE_SIGN_ENTITLEMENTS: Sources/App/OlcRTCClient.entitlements
        # and flip the global CODE_SIGNING_ALLOWED back to YES.
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed).
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # OlcRTCMobile pulls Go runtime/stdlib code that references the
        # BSD resolver symbols `_res_9_nclose`, `_res_9_ninit`, and
        # `_res_9_nsearch`. On iOS those live in `libresolv.tbd`, which
        # is not linked by default. Link it explicitly here so the Debug
        # iphonesimulator and Release iphoneos builds resolve those
        # symbols. See `docs/ai/TASK_LOG.md` and section "libresolv" in
        # `docs/ai/GOMOBILE_BINDINGS.md`.
        OTHER_LDFLAGS: $(inherited) -lresolv
    dependencies:
      - target: PacketTunnelProvider
        embed: true
        codeSign: false
      # OlcRTCMobile.xcframework is generated by scripts/build-gomobile-ios.sh
      # and placed at ios/OlcRTCClient/Frameworks/OlcRTCMobile.xcframework.
      # It is gitignored (see .gitignore) and must not be committed. The
      # framework is only linked into the main app target for now; the
      # PacketTunnelProvider extension will be wired in a later step once
      # APPLICATION_EXTENSION_API_ONLY compatibility is validated.
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: true
        codeSign: false
  PacketTunnelProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/PacketTunnelProvider
      - path: Sources/Shared
    info:
      path: Sources/PacketTunnelProvider/Info.plist
      properties:
        CFBundleDisplayName: olcRTC Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.PacketTunnelProvider
        # Entitlements detached for the unsigned CI build path — see the
        # main app target comment above and ADR-0008. The
        # `PacketTunnelProvider.entitlements` file is kept as a
        # future-signing reference and gets attached when a signing
        # identity is configured.
        APPLICATION_EXTENSION_API_ONLY: YES
        # Kept from probe v7. Probes v5–v8 confirmed via the captured
        # xcodebuild log that disabling LTO removes `-flto=…` from
        # per-TU clang/swiftc invocations and changes the linker's
        # codegen path. The link-stripping behavior persists with LTO
        # off, so LTO is not the cause — but leaving it off keeps the
        # probe's link-state minimal and removes a confounding
        # variable from the v9 diagnostics. See `docs/ai/TASK_LOG.md`
        # for the v7/v8 evidence.
        LLVM_LTO: NO
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed). Same value as
        # the host app — both targets look in the same Frameworks/ dir.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # The Go runtime inside OlcRTCMobile references the BSD resolver
        # symbols `_res_9_n{init,close,search}`, which live in
        # `libresolv.tbd` on iOS and are not linked by default. The host
        # app already links it explicitly (see above) for the same
        # reason; mirror it here so the extension's linker resolves the
        # same symbols.
        #
        # Probe v9 (branch `packet-tunnel-gomobile-probe`) drops the
        # v5–v8 `-Wl,-u,_OlcRTCExtensionGomobileLinkAnchor` linker
        # force-load flag and its companion `GomobileExtensionLinkAnchor.m`
        # file. Every artificial anchor (linker-forced symbols,
        # `__attribute__((constructor))` functions, stored-property
        # anchors) was stripped by ld_prime's regular dead-strip on
        # Xcode 16.4 / iOS 18.5 SDK — final `otool -L` never showed
        # `OlcRTCMobile.framework`. v9 replaces all of that with a
        # direct call to `GomobileExtensionProbe.touchNonStartingAPI()`
        # from `PacketTunnelProvider.startTunnel`, which is reachable
        # from the extension's `NSExtensionPrincipalClass` and
        # therefore not strippable.
        OTHER_LDFLAGS: $(inherited) -lresolv
    dependencies:
      # `OlcRTCMobile.xcframework` linked into the extension target as a
      # COMPILE / LINK probe only (branch
      # `packet-tunnel-gomobile-probe`, see ADR-0006 and Milestone 3 in
      # `docs/ROADMAP.md`). `embed: false` so the framework is NOT
      # double-embedded — the host app already owns the bundled binary
      # under its own `Frameworks/` and the extension uses the same
      # copy at runtime via the bundle search path. `link: true` is
      # required to make the symbols available to the extension's
      # compile/link step.
      #
      # We deliberately do NOT run any olcRTC network code from the
      # extension yet (no MobileStart / MobileStartWithTransport /
      # MobileCheck / MobilePing call from the extension's startTunnel).
      # Probe v9 calls `GomobileExtensionProbe.touchNonStartingAPI()`
      # from `PacketTunnelProvider.startTunnel`, which references
      # `MobileIsRunning` and `MobileSetDebug(false)` — both
      # configure / read-only — so the symbols get linked from a
      # real runtime entrypoint. That proves the extension target
      # can link against OlcRTCMobile under
      # `APPLICATION_EXTENSION_API_ONLY = YES`. Real `startTunnel`
      # wiring stays gated on Milestone 4 (signed build + real VPN
      # runtime).
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: false
        codeSign: false
        link: true
  OlcRTCClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/OlcRTCClientTests
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.tests
schemes:
  OlcRTCClient:
    build:
      targets:
        OlcRTCClient: all
        PacketTunnelProvider: all
    test:
      targets:
        - OlcRTCClientTests
