name: OlcRTCClient
options:
  bundleIdPrefix: org.openlibrecommunity.olcrtc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # Unsigned build path — see ADR-0008 in docs/ai/DECISIONS.md.
    # Real-device VPN runtime requires a paid Apple Developer account,
    # provisioning profile scoped to the PacketTunnelProvider, and the
    # com.apple.developer.networking.networkextension entitlement.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  OlcRTCClient:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: olcRTC
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - olcrtc
        CFBundleURLTypes:
          - CFBundleURLName: org.openlibrecommunity.olcrtc.url
            CFBundleURLSchemes:
              - olcrtc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client
        # Entitlements are intentionally NOT attached in the current
        # unsigned CI build path. `Sources/App/OlcRTCClient.entitlements`
        # is kept in the repo as a future-signing reference (App Group +
        # com.apple.developer.networking.networkextension). When a
        # signing identity is configured later (see ADR-0008), set:
        #   CODE_SIGN_ENTITLEMENTS: Sources/App/OlcRTCClient.entitlements
        # and flip the global CODE_SIGNING_ALLOWED back to YES.
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed).
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # OlcRTCMobile pulls Go runtime/stdlib code that references the
        # BSD resolver symbols `_res_9_nclose`, `_res_9_ninit`, and
        # `_res_9_nsearch`. On iOS those live in `libresolv.tbd`, which
        # is not linked by default. Link it explicitly here so the Debug
        # iphonesimulator and Release iphoneos builds resolve those
        # symbols. See `docs/ai/TASK_LOG.md` and section "libresolv" in
        # `docs/ai/GOMOBILE_BINDINGS.md`.
        OTHER_LDFLAGS: $(inherited) -lresolv
    dependencies:
      - target: PacketTunnelProvider
        embed: true
        codeSign: false
      # OlcRTCMobile.xcframework is generated by scripts/build-gomobile-ios.sh
      # and placed at ios/OlcRTCClient/Frameworks/OlcRTCMobile.xcframework.
      # It is gitignored (see .gitignore) and must not be committed. The
      # framework is only linked into the main app target for now; the
      # PacketTunnelProvider extension will be wired in a later step once
      # APPLICATION_EXTENSION_API_ONLY compatibility is validated.
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: true
        codeSign: false
  PacketTunnelProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/PacketTunnelProvider
      - path: Sources/Shared
    info:
      path: Sources/PacketTunnelProvider/Info.plist
      properties:
        CFBundleDisplayName: olcRTC Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.PacketTunnelProvider
        # Entitlements detached for the unsigned CI build path — see the
        # main app target comment above and ADR-0008. The
        # `PacketTunnelProvider.entitlements` file is kept as a
        # future-signing reference and gets attached when a signing
        # identity is configured.
        APPLICATION_EXTENSION_API_ONLY: YES
        # Kept from probe v7. Probes v5–v8 confirmed via the captured
        # xcodebuild log that disabling LTO removes `-flto=…` from
        # per-TU clang/swiftc invocations and changes the linker's
        # codegen path. The link-stripping behavior persists with LTO
        # off, so LTO is not the cause — but leaving it off keeps the
        # probe's link-state minimal and removes a confounding
        # variable from the v9 diagnostics. See `docs/ai/TASK_LOG.md`
        # for the v7/v8 evidence.
        LLVM_LTO: NO
        # Framework search path for OlcRTCMobile.xcframework (generated by
        # scripts/build-gomobile-ios.sh, not committed). Same value as
        # the host app — both targets look in the same Frameworks/ dir.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/Frameworks
        # The Go runtime inside OlcRTCMobile references the BSD resolver
        # symbols `_res_9_n{init,close,search}`, which live in
        # `libresolv.tbd` on iOS and are not linked by default. The host
        # app already links it explicitly (see above) for the same
        # reason; mirror it here so the extension's linker resolves the
        # same symbols.
        #
        # Probe v12 (branch `packet-tunnel-gomobile-probe`,
        # Milestone 3 in `docs/ROADMAP.md`). Probe v11 proved that
        # `OlcRTCMobile.xcframework`'s device slice
        # (`ios-arm64/OlcRTCMobile.framework/OlcRTCMobile`) is a
        # `current ar archive` — i.e. a static framework wrapper
        # around a `.a`-style archive, not a Mach-O dylib. Probes
        # v2–v10 fought ld_prime's dead-strip with anchors; v10
        # flipped to `embed: true` and watched Xcode's embed phase
        # run `builtin-copy -remove-static-executable` and inject
        # a codeless stub binary into both `.app/Frameworks/` and
        # `.appex/Frameworks/`. Stub-injection means there are no
        # Mobile symbols inside the embedded copies at runtime,
        # regardless of how the extension is linked.
        #
        # The correct model for a gomobile static framework is to
        # link the archive into the consuming executable, NOT to
        # embed it as a separate framework directory. The host app
        # already gets the Go runtime that way (the static
        # archive's object files end up in the app executable
        # itself). v12 mirrors that for the extension by
        # force-loading the device slice's static archive into the
        # extension binary. Without `-force_load`, ld treats the
        # archive's objects as candidates for dead-stripping and
        # drops everything not reachable from a real symbol
        # reference — which is what every prior probe ran into.
        # `-force_load <archive-path>` keeps every object file
        # from that one archive, so the gomobile-bound `Mobile*`
        # exports survive into the final extension executable.
        #
        # The path resolves through `$(SRCROOT)`, which XcodeGen
        # sets to the directory holding `OlcRTCClient.xcodeproj`
        # (`ios/OlcRTCClient`). The xcframework lives at
        # `ios/OlcRTCClient/Frameworks/OlcRTCMobile.xcframework`,
        # so the device-slice static archive is at
        # `Frameworks/OlcRTCMobile.xcframework/ios-arm64/OlcRTCMobile.framework/OlcRTCMobile`.
        # We deliberately do NOT use `-all_load`; force-load is
        # scoped to the one archive that needs it.
        OTHER_LDFLAGS: $(inherited) -lresolv -force_load $(SRCROOT)/Frameworks/OlcRTCMobile.xcframework/ios-arm64/OlcRTCMobile.framework/OlcRTCMobile
    dependencies:
      # `OlcRTCMobile.xcframework` is a *static* framework wrapper —
      # probe v11 showed `ios-arm64/OlcRTCMobile.framework/OlcRTCMobile`
      # is a `current ar archive`, not a Mach-O dylib. Embedding it
      # via `embed: true` triggers Xcode's
      # `builtin-copy -remove-static-executable` step, which strips
      # the archive and injects a codeless stub binary — the v10 / v11
      # finding. v12 therefore drops `embed: true` and uses a
      # link-only dependency:
      #
      #   - `embed: false`  — no Copy Files (Embed Frameworks) phase
      #     for this framework into the `.appex`. The extension does
      #     not get its own `Frameworks/OlcRTCMobile.framework`
      #     directory; the static archive is instead linked directly
      #     into the extension executable.
      #   - `link: true`    — XcodeGen still adds the framework to
      #     `Link Binary With Libraries`, exposes its `Modules/` to
      #     the Swift compile step (so `import OlcRTCMobile`
      #     resolves), and registers the link edge with the project
      #     graph. The actual symbol pull is done by the
      #     `-force_load` flag in `OTHER_LDFLAGS` above.
      #   - `codeSign: false` — keeps any residual copy step from
      #     trying to re-sign the framework under the unsigned CI
      #     path (`CODE_SIGNING_ALLOWED=NO`).
      #
      # We deliberately do NOT run any olcRTC network code from the
      # extension yet (no `MobileStart`, `MobileStartWithTransport`,
      # `MobileCheck`, or `MobilePing` call from the extension's
      # `startTunnel`). Probe v9's
      # `GomobileExtensionProbe.touchNonStartingAPI()` call from
      # `startTunnel` stays in place — it references
      # `MobileIsRunning` and `MobileSetDebug(false)`, both
      # configure / read-only. Real `startTunnel` wiring stays
      # gated on Milestone 4 (signed build + real VPN runtime).
      - framework: Frameworks/OlcRTCMobile.xcframework
        embed: false
        link: true
        codeSign: false
  OlcRTCClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/OlcRTCClientTests
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlibrecommunity.olcrtc.client.tests
schemes:
  OlcRTCClient:
    build:
      targets:
        OlcRTCClient: all
        PacketTunnelProvider: all
    test:
      targets:
        - OlcRTCClientTests
