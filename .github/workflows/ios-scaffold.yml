name: iOS Scaffold Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/OlcRTCClient/**"
      - "docs/ai/**"
      - ".github/workflows/ios-scaffold.yml"

# This workflow validates the iOS scaffold only — XcodeGen + SwiftUI
# app + PacketTunnelProvider target. It does NOT integrate gomobile,
# does NOT produce a signed or unsigned IPA, and does NOT exercise the
# Go core. See docs/ai/TASK_LOG.md and ADR-0008 in
# docs/ai/DECISIONS.md.

jobs:
  scaffold-build:
    name: Scaffold Build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/OlcRTCClient
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/OlcRTCClient/OlcRTCClient.xcodeproj

      - name: Diagnose simulator availability
        run: |
          xcrun simctl list devices available || true
          xcodebuild -showsdks

      - name: Pick iOS Simulator destination
        run: |
          # `xcodebuild test` needs a concrete bootable simulator (a
          # `generic/platform=iOS Simulator` destination is rejected).
          # Pick the first available iPhone simulator at runtime so we
          # don't hardcode a device name that might not be installed on
          # the GitHub Actions runner image.
          UDID=$(xcrun simctl list devices available -j 2>/dev/null \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devs in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          " || true)
          if [ -n "$UDID" ]; then
            echo "Selected iPhone simulator UDID: $UDID"
            echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          else
            echo "No concrete iPhone simulator available, falling back to generic destination."
            echo "IOS_SIMULATOR_DESTINATION=generic/platform=iOS Simulator" >> "$GITHUB_ENV"
          fi

      - name: Build app (unsigned, iphonesimulator)
        run: |
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run tests (iphonesimulator)
        run: |
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${IOS_SIMULATOR_DESTINATION}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Build app (unsigned, iphoneos generic)
        run: |
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
