name: Packet Tunnel Gomobile Probe

# Compile/link probe (branch `packet-tunnel-gomobile-probe`) — verifies
# that the `PacketTunnelProvider` extension target can link against
# `OlcRTCMobile.xcframework` under `APPLICATION_EXTENSION_API_ONLY =
# YES`. This is an experiment, NOT a packaging or runtime step.
#
# Hard scope (see Milestone 3 in `docs/ROADMAP.md`):
# - We DO NOT package an IPA here.
# - We DO NOT call MobileStart / MobileStartWithTransport / MobileCheck
#   / MobilePing from the extension.
# - We DO NOT run app tests (the host-app green path lives in
#   `iOS App + Gomobile Build`, and this probe deliberately stays
#   single-purpose so failures point at one thing).
# - Code signing stays disabled; entitlements stay detached.
#
# Acceptance criterion: this workflow runs green. That means the
# extension target compiled and linked against OlcRTCMobile under
# APPLICATION_EXTENSION_API_ONLY = YES, without iOS rejecting any
# symbol or build setting. A red run captures the exact symbol /
# directive / linker error in the log, which drives the next step.

on:
  workflow_dispatch:
  push:
    branches:
      - packet-tunnel-gomobile-probe
    paths:
      - "scripts/build-gomobile-ios.sh"
      - "ios/OlcRTCClient/project.yml"
      - "ios/OlcRTCClient/Sources/PacketTunnelProvider/**"
      - "ios/OlcRTCClient/Sources/Shared/**"
      - ".github/workflows/packet-tunnel-gomobile-probe.yml"
      - ".gitmodules"
      - "third_party/olcrtc"

jobs:
  probe:
    name: PacketTunnelProvider + Gomobile (probe)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Submodule status
        run: git submodule status --recursive

      - name: Setup Go (from third_party/olcrtc/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/olcrtc/go.mod
          cache: false

      - name: Print Go version
        run: go version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build OlcRTCMobile.xcframework
        run: scripts/build-gomobile-ios.sh

      - name: Generate Xcode project
        working-directory: ios/OlcRTCClient
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/OlcRTCClient/OlcRTCClient.xcodeproj

      # The project's only scheme today (`OlcRTCClient`) already
      # depends on both `OlcRTCClient` and `PacketTunnelProvider`
      # targets (see `schemes` in `project.yml`). Building that scheme
      # for Release iphoneos generic therefore exercises the
      # extension's compile and link path — which is what this probe
      # is checking. We do NOT add a dedicated extension scheme: the
      # extension target is not buildable on its own from the
      # generated project (Xcode requires a host for app extensions
      # in the scheme), and adding one would diverge from the host
      # app's pipeline for no probe value.
      - name: Build PacketTunnelProvider via host scheme (unsigned, Release, iphoneos generic)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Confirm extension binary actually linked
        run: |
          set -euo pipefail
          # The host scheme depends on PacketTunnelProvider, so a green
          # build above means the extension's compile + link path
          # succeeded. Sanity-check the artifact still exists at the
          # deterministic location for completeness; this guards
          # against a silent regression where the dependency edge is
          # dropped from the scheme.
          APPEX="build/DerivedData/Build/Products/Release-iphoneos/PacketTunnelProvider.appex"
          if [ ! -d "$APPEX" ]; then
            echo "ERROR: extension bundle missing at $APPEX" >&2
            exit 1
          fi
          if [ ! -f "$APPEX/PacketTunnelProvider" ]; then
            echo "ERROR: extension binary missing at $APPEX/PacketTunnelProvider" >&2
            exit 1
          fi
          # Print Mach-O architecture + nm-undefined sample so the log
          # captures whether the OlcRTCMobile linkage actually
          # contributed any symbols. We don't FAIL on this — it's a
          # diagnostic. The probe's source-of-truth pass/fail is the
          # xcodebuild step above.
          file "$APPEX/PacketTunnelProvider"
          echo "--- otool -L (libraries linked) ---"
          otool -L "$APPEX/PacketTunnelProvider" || true
          echo
          echo "--- nm | grep -c Mobile (count of OlcRTCMobile-prefixed symbol refs) ---"
          (nm -u "$APPEX/PacketTunnelProvider" 2>/dev/null | grep -c "Mobile") || echo "0"
          echo
          echo "OK: PacketTunnelProvider.appex compiled and linked."

      - name: Probe summary
        if: always()
        run: |
          {
            echo "# Packet Tunnel Gomobile Probe"
            echo
            echo "- **Result:** ${{ job.status }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo
            echo "## What this probe means"
            echo
            echo "A green run here means the \`PacketTunnelProvider\`"
            echo "extension target compiled and linked against"
            echo "\`OlcRTCMobile.xcframework\` under"
            echo "\`APPLICATION_EXTENSION_API_ONLY = YES\` with code"
            echo "signing disabled."
            echo
            echo "It does **not** mean VPN Mode runtime works. The"
            echo "extension still does not call any \`MobileStart*\`"
            echo "from \`startTunnel\` and still fails fast with"
            echo "\`notWiredYet\`. Real packet routing remains gated"
            echo "on Milestone 4 in \`docs/ROADMAP.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
