name: Packet Tunnel Gomobile Probe

# Compile/link probe (branch `packet-tunnel-gomobile-probe`) — verifies
# that the `PacketTunnelProvider` extension target can link against
# `OlcRTCMobile.xcframework` under `APPLICATION_EXTENSION_API_ONLY =
# YES`. This is an experiment, NOT a packaging or runtime step.
#
# Hard scope (see Milestone 3 in `docs/ROADMAP.md`):
# - We DO NOT package an IPA here.
# - We DO NOT call MobileStart / MobileStartWithTransport / MobileCheck
#   / MobilePing from the extension.
# - We DO NOT run app tests (the host-app green path lives in
#   `iOS App + Gomobile Build`, and this probe deliberately stays
#   single-purpose so failures point at one thing).
# - Code signing stays disabled; entitlements stay detached.
#
# Acceptance criterion: this workflow runs green. That means the
# extension target compiled and linked against OlcRTCMobile under
# APPLICATION_EXTENSION_API_ONLY = YES, without iOS rejecting any
# symbol or build setting. A red run captures the exact symbol /
# directive / linker error in the log, which drives the next step.

on:
  workflow_dispatch:
  push:
    branches:
      - packet-tunnel-gomobile-probe
    paths:
      - "scripts/build-gomobile-ios.sh"
      - "ios/OlcRTCClient/project.yml"
      - "ios/OlcRTCClient/Sources/PacketTunnelProvider/**"
      - "ios/OlcRTCClient/Sources/Shared/**"
      - ".github/workflows/packet-tunnel-gomobile-probe.yml"
      - ".gitmodules"
      - "third_party/olcrtc"

jobs:
  probe:
    name: PacketTunnelProvider + Gomobile (probe)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Submodule status
        run: git submodule status --recursive

      - name: Setup Go (from third_party/olcrtc/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/olcrtc/go.mod
          cache: false

      - name: Print Go version
        run: go version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build OlcRTCMobile.xcframework
        run: scripts/build-gomobile-ios.sh

      - name: Generate Xcode project
        working-directory: ios/OlcRTCClient
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/OlcRTCClient/OlcRTCClient.xcodeproj

      # The project's only scheme today (`OlcRTCClient`) already
      # depends on both `OlcRTCClient` and `PacketTunnelProvider`
      # targets (see `schemes` in `project.yml`). Building that scheme
      # for Release iphoneos generic therefore exercises the
      # extension's compile and link path — which is what this probe
      # is checking. We do NOT add a dedicated extension scheme: the
      # extension target is not buildable on its own from the
      # generated project (Xcode requires a host for app extensions
      # in the scheme), and adding one would diverge from the host
      # app's pipeline for no probe value.
      - name: Build PacketTunnelProvider via host scheme (unsigned, Release, iphoneos generic)
        run: |
          set -euo pipefail
          mkdir -p build
          # Tee xcodebuild's full stdout/stderr to build/xcodebuild.log so
          # the next step can quote the relevant Ld invocation directly,
          # while still streaming the same lines to the GitHub Actions
          # console for live debugging.
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Confirm extension binary actually linked against OlcRTCMobile
        run: |
          set -euo pipefail
          # The host scheme depends on PacketTunnelProvider, so a green
          # build above means the extension's compile + link path
          # succeeded. We need a stronger check than "the file exists":
          # if the link edge to OlcRTCMobile is silently dropped, the
          # extension still compiles but ships without any gomobile
          # symbol references — and we'd be reporting a green probe
          # that didn't actually exercise the framework. Probes v2-v5
          # walked through Swift WMO elision, ld dead-strip, ld_prime
          # `-needed_framework` shadowing, and LTO call-site folding;
          # see `docs/ai/TASK_LOG.md`. The v6 confirm step inspects
          # both the final extension binary and the per-translation-
          # unit `.o` files so a future failure points at the exact
          # layer that ate the references.
          APPEX="build/DerivedData/Build/Products/Release-iphoneos/PacketTunnelProvider.appex"
          if [ ! -d "$APPEX" ]; then
            echo "ERROR: extension bundle missing at $APPEX" >&2
            exit 1
          fi
          if [ ! -f "$APPEX/PacketTunnelProvider" ]; then
            echo "ERROR: extension binary missing at $APPEX/PacketTunnelProvider" >&2
            exit 1
          fi

          file "$APPEX/PacketTunnelProvider"

          # ---------- A. Final binary diagnostics ----------
          echo
          echo "=== A. Final binary diagnostics ==="
          echo
          echo "--- otool -L (full library list) ---"
          otool -L "$APPEX/PacketTunnelProvider" || true

          echo
          echo "--- nm -u | grep Mobile(IsRunning|SetDebug) (final binary undef refs) ---"
          # Capture without piping into grep first: an empty grep result
          # under `set -euo pipefail` would abort the step with a
          # confusing exit code 1. Compute, then assert below.
          final_mobile_undefs="$(nm -u "$APPEX/PacketTunnelProvider" 2>/dev/null \
            | grep -E 'Mobile(IsRunning|SetDebug)' || true)"
          if [ -n "$final_mobile_undefs" ]; then
            echo "$final_mobile_undefs"
          else
            echo "(none)"
          fi

          echo
          echo "--- nm | grep OlcRTCExtensionGomobileLinkAnchor|OlcRTCGomobile (final binary defined symbols) ---"
          final_anchor_defs="$(nm "$APPEX/PacketTunnelProvider" 2>/dev/null \
            | grep -E 'OlcRTCExtensionGomobileLinkAnchor|OlcRTCGomobile' || true)"
          if [ -n "$final_anchor_defs" ]; then
            echo "$final_anchor_defs"
          else
            echo "(none)"
          fi

          # ---------- B. Intermediate object diagnostics ----------
          echo
          echo "=== B. Intermediate object diagnostics (PacketTunnelProvider .build/**/*.o) ==="
          # Aggregate flag: did ANY .o file produced for the extension
          # target carry a `Mobile(IsRunning|SetDebug)` symbol
          # (defined OR undefined)? If yes, the references survived
          # clang's per-TU compile and the question moves to the
          # linker / LTO. If no, the references never made it into
          # any object file and the failure is upstream of ld.
          obj_has_mobile_refs=0
          # Track whether we actually found any .o files at all — if
          # not, the find pattern is wrong for this Xcode/derived-data
          # layout and we want the diagnostic to say so loudly.
          obj_count=0

          while IFS= read -r obj; do
            obj_count=$((obj_count + 1))
            echo
            echo "--- $obj ---"
            mobile_in_obj="$(nm "$obj" 2>/dev/null \
              | grep -E 'Mobile(IsRunning|SetDebug)|OlcRTCExtensionGomobileLinkAnchor|OlcRTCGomobile' \
              || true)"
            if [ -n "$mobile_in_obj" ]; then
              echo "$mobile_in_obj"
            else
              echo "(no matching symbols)"
            fi
            mobile_undef_in_obj="$(nm -u "$obj" 2>/dev/null \
              | grep -E 'Mobile(IsRunning|SetDebug)' || true)"
            if [ -n "$mobile_undef_in_obj" ]; then
              echo "[undef] $mobile_undef_in_obj"
              obj_has_mobile_refs=1
            fi
          done < <(find build/DerivedData -path '*PacketTunnelProvider.build*' -name '*.o' -print 2>/dev/null)

          echo
          echo "--- intermediate object summary ---"
          echo "object file count: $obj_count"
          echo "any Mobile(IsRunning|SetDebug) undef in any .o: $obj_has_mobile_refs"

          # ---------- C. Linker command ----------
          echo
          echo "=== C. Ld step for PacketTunnelProvider.appex (from xcodebuild log) ==="
          ld_step="(unavailable)"
          if [ -f build/xcodebuild.log ]; then
            ld_step="$(awk '
              /^Ld .*PacketTunnelProvider\.appex\/PacketTunnelProvider normal/ { capture=1; print; next }
              capture==1 && /^[[:space:]]/ { print; next }
              capture==1 { capture=0 }
            ' build/xcodebuild.log || true)"
            echo "$ld_step"
          else
            echo "(xcodebuild.log not present)"
          fi

          # Did LTO actually disappear from the linker command?
          # Probe v7 sets `LLVM_LTO = NO` for this target; if the
          # build setting did not take effect the Ld step still
          # carries `-Xlinker -object_path_lto -Xlinker
          # …PacketTunnelProvider_lto.o`. Either way we want this
          # surfaced explicitly in the log and the classification
          # below.
          if [ "$ld_step" != "(unavailable)" ] && \
             echo "$ld_step" | grep -q -- '-object_path_lto'; then
            lto_still_enabled=1
          else
            lto_still_enabled=0
          fi
          echo
          echo "LTO still enabled (Ld step carries -object_path_lto): $lto_still_enabled"

          # ---------- D. Classification ----------
          echo
          echo "=== D. Result classification ==="
          # The build step ran to completion (we are in the confirm
          # step), so FAIL-COMPILE and FAIL-LINK do not apply here —
          # those would have aborted the previous step with a clang
          # or ld diagnostic. The remaining live classifications are:
          #   PASS, PASS-WEAK, FAIL-LTO-STILL-ENABLED,
          #   FAIL-STRIPPED-BEFORE-LINK, FAIL-STRIPPED-AFTER-LINK,
          #   FAIL-OTHER.
          otool_has_olcrtc=0
          if otool -L "$APPEX/PacketTunnelProvider" 2>/dev/null \
              | grep -q "OlcRTCMobile.framework/OlcRTCMobile"; then
            otool_has_olcrtc=1
          fi

          classification=""
          if [ "$otool_has_olcrtc" -eq 1 ] && [ -n "$final_mobile_undefs" ]; then
            classification="PASS"
          elif [ "$otool_has_olcrtc" -eq 1 ] && [ -z "$final_mobile_undefs" ]; then
            # Load command is present but no surviving undef refs —
            # unusual for v6+ (the C anchor is supposed to keep both).
            # Treat as PASS for the original "extension links against
            # OlcRTCMobile" goal but flag the missing undefs.
            classification="PASS-WEAK"
          elif [ "$lto_still_enabled" -eq 1 ]; then
            # Probe v7 specifically: if `LLVM_LTO = NO` did not flow
            # through to the actual linker invocation, classify
            # explicitly so the next iteration knows to pick a
            # different setting spelling rather than another anchor
            # strategy.
            classification="FAIL-LTO-STILL-ENABLED"
          elif [ "$obj_has_mobile_refs" -eq 0 ] && [ "$obj_count" -gt 0 ]; then
            classification="FAIL-STRIPPED-BEFORE-LINK"
          elif [ "$obj_has_mobile_refs" -eq 1 ] && [ "$otool_has_olcrtc" -eq 0 ]; then
            classification="FAIL-STRIPPED-AFTER-LINK"
          else
            classification="FAIL-OTHER"
          fi

          echo "classification: $classification"
          echo "  otool -L has OlcRTCMobile.framework: $otool_has_olcrtc"
          echo "  final binary has Mobile* undef refs: $([ -n "$final_mobile_undefs" ] && echo 1 || echo 0)"
          echo "  intermediate .o has Mobile* undef refs: $obj_has_mobile_refs"
          echo "  intermediate .o file count: $obj_count"
          echo "  LTO still enabled in Ld step: $lto_still_enabled"

          case "$classification" in
            PASS|PASS-WEAK)
              echo
              echo "OK: PacketTunnelProvider.appex links against OlcRTCMobile ($classification)."
              ;;
            FAIL-LTO-STILL-ENABLED)
              echo "ERROR: $classification — the Ld step still passes -object_path_lto." >&2
              echo "       LLVM_LTO = NO in project.yml did not flow through to the actual linker invocation." >&2
              echo "       Check the captured Ld step above and the target's settings.base in project.yml." >&2
              exit 1
              ;;
            FAIL-STRIPPED-BEFORE-LINK)
              echo "ERROR: $classification — no Mobile(IsRunning|SetDebug) refs survived in any extension .o file." >&2
              echo "       The references were eliminated before the linker ran (clang / Swift / LTO bitcode stage)." >&2
              echo "       Inspect Sources/PacketTunnelProvider/GomobileExtensionLinkAnchor.m" >&2
              echo "       and the per-target Swift compile units." >&2
              exit 1
              ;;
            FAIL-STRIPPED-AFTER-LINK)
              echo "ERROR: $classification — Mobile* refs were present in intermediate .o files but the final binary has no OlcRTCMobile load command." >&2
              echo "       The linker dropped the references during ld / LTO native code generation." >&2
              echo "       Check the captured Ld step above and OTHER_LDFLAGS in project.yml." >&2
              exit 1
              ;;
            *)
              echo "ERROR: $classification — see diagnostics above." >&2
              exit 1
              ;;
          esac

      - name: Probe summary
        if: always()
        run: |
          {
            echo "# Packet Tunnel Gomobile Probe"
            echo
            echo "- **Result:** ${{ job.status }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo
            echo "## What this probe means"
            echo
            echo "A green run here means the \`PacketTunnelProvider\`"
            echo "extension target compiled and linked against"
            echo "\`OlcRTCMobile.xcframework\` under"
            echo "\`APPLICATION_EXTENSION_API_ONLY = YES\` with code"
            echo "signing disabled."
            echo
            echo "It does **not** mean VPN Mode runtime works. The"
            echo "extension still does not call any \`MobileStart*\`"
            echo "from \`startTunnel\` and still fails fast with"
            echo "\`notWiredYet\`. Real packet routing remains gated"
            echo "on Milestone 4 in \`docs/ROADMAP.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
