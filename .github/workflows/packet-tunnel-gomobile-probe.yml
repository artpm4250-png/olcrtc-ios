name: Packet Tunnel Gomobile Probe

# Compile/link probe (branch `packet-tunnel-gomobile-probe`) — verifies
# that the `PacketTunnelProvider` extension target can link against
# `OlcRTCMobile.xcframework` under `APPLICATION_EXTENSION_API_ONLY =
# YES`. This is an experiment, NOT a packaging or runtime step.
#
# Hard scope (see Milestone 3 in `docs/ROADMAP.md`):
# - We DO NOT package an IPA here.
# - We DO NOT call MobileStart / MobileStartWithTransport / MobileCheck
#   / MobilePing from the extension.
# - We DO NOT run app tests (the host-app green path lives in
#   `iOS App + Gomobile Build`, and this probe deliberately stays
#   single-purpose so failures point at one thing).
# - Code signing stays disabled; entitlements stay detached.
#
# Acceptance criterion: this workflow runs green. That means the
# extension target compiled and linked against OlcRTCMobile under
# APPLICATION_EXTENSION_API_ONLY = YES, without iOS rejecting any
# symbol or build setting. A red run captures the exact symbol /
# directive / linker error in the log, which drives the next step.

on:
  workflow_dispatch:
  push:
    branches:
      - packet-tunnel-gomobile-probe
    paths:
      - "scripts/build-gomobile-ios.sh"
      - "ios/OlcRTCClient/project.yml"
      - "ios/OlcRTCClient/Sources/PacketTunnelProvider/**"
      - "ios/OlcRTCClient/Sources/Shared/**"
      - ".github/workflows/packet-tunnel-gomobile-probe.yml"
      - ".gitmodules"
      - "third_party/olcrtc"

jobs:
  probe:
    name: PacketTunnelProvider + Gomobile (probe)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Submodule status
        run: git submodule status --recursive

      - name: Setup Go (from third_party/olcrtc/go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/olcrtc/go.mod
          cache: false

      - name: Print Go version
        run: go version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build OlcRTCMobile.xcframework
        run: scripts/build-gomobile-ios.sh

      - name: Generate Xcode project
        working-directory: ios/OlcRTCClient
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project ios/OlcRTCClient/OlcRTCClient.xcodeproj

      # The project's only scheme today (`OlcRTCClient`) already
      # depends on both `OlcRTCClient` and `PacketTunnelProvider`
      # targets (see `schemes` in `project.yml`). Building that scheme
      # for Release iphoneos generic therefore exercises the
      # extension's compile and link path — which is what this probe
      # is checking. We do NOT add a dedicated extension scheme: the
      # extension target is not buildable on its own from the
      # generated project (Xcode requires a host for app extensions
      # in the scheme), and adding one would diverge from the host
      # app's pipeline for no probe value.
      - name: Build PacketTunnelProvider via host scheme (unsigned, Release, iphoneos generic)
        run: |
          set -euo pipefail
          mkdir -p build
          # Tee xcodebuild's full stdout/stderr to build/xcodebuild.log so
          # the next step can quote the relevant Ld invocation directly,
          # while still streaming the same lines to the GitHub Actions
          # console for live debugging.
          xcodebuild \
            -project ios/OlcRTCClient/OlcRTCClient.xcodeproj \
            -scheme OlcRTCClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Confirm extension binary actually linked against OlcRTCMobile
        run: |
          set -euo pipefail
          # The host scheme depends on PacketTunnelProvider, so a green
          # build above means the extension's compile + link path
          # succeeded. We need a stronger check than "the file exists":
          # if the link edge to OlcRTCMobile is silently dropped, the
          # extension still compiles but ships without any gomobile
          # symbol references — and we'd be reporting a green probe
          # that didn't actually exercise the framework.
          #
          # Probe history (see `docs/ai/TASK_LOG.md`):
          # - v2 used a Swift stored property calling `MobileIsRunning`
          #   — eliminated by Swift WMO before the linker ran.
          # - v3 added `-Wl,-u,_MobileIsRunning` — ld dead-stripped the
          #   framework anyway.
          # - v4 added `-Wl,-needed_framework,OlcRTCMobile` — ld_prime
          #   allowed the trailing `-framework OlcRTCMobile` to shadow
          #   the `needed` flag.
          # - v5 moved the anchor to a C function with
          #   `__attribute__((used))` — symbol survived, body folded.
          # - v6 used static function-pointer initializers — relocations
          #   nullified.
          # - v7 disabled LTO — proved LTO was not the cause.
          # - v8 added `__attribute__((constructor))` — still stripped.
          # - v9 called the probe from `PacketTunnelProvider.startTunnel`
          #   — still stripped. ld treats `_NSExtensionMain` as the
          #   only true root and the principal class as reachable
          #   only via Objective-C runtime string dispatch, so it
          #   nullifies instruction-level call sites it can't
          #   statically prove are live.
          # - v10 (this run) embeds the gomobile framework into the
          #   extension bundle via XcodeGen `embed: true`. ld can no
          #   longer drop `LC_LOAD_DYLIB` (or, if it does, dyld
          #   resolves the embedded copy at runtime anyway). v10
          #   classifies primarily on bundle structure: did the
          #   framework actually get copied into the `.appex`?
          APPEX="build/DerivedData/Build/Products/Release-iphoneos/PacketTunnelProvider.appex"
          APP="build/DerivedData/Build/Products/Release-iphoneos/OlcRTCClient.app"
          if [ ! -d "$APPEX" ]; then
            echo "ERROR: extension bundle missing at $APPEX" >&2
            exit 1
          fi
          if [ ! -f "$APPEX/PacketTunnelProvider" ]; then
            echo "ERROR: extension binary missing at $APPEX/PacketTunnelProvider" >&2
            exit 1
          fi

          file "$APPEX/PacketTunnelProvider"

          # ---------- A. Final extension binary diagnostics ----------
          echo
          echo "=== A. Final extension binary diagnostics ==="
          echo
          echo "--- otool -L (full library list) ---"
          otool -L "$APPEX/PacketTunnelProvider" || true

          echo
          echo "--- otool -l | grep -A2 LC_LOAD_DYLIB (load commands) ---"
          otool -l "$APPEX/PacketTunnelProvider" 2>/dev/null \
            | grep -A 2 -E 'LC_LOAD_DYLIB|LC_LOAD_WEAK_DYLIB' || true

          echo
          echo "--- nm -u | grep Mobile(IsRunning|SetDebug) (final binary undef refs) ---"
          final_mobile_undefs="$(nm -u "$APPEX/PacketTunnelProvider" 2>/dev/null \
            | grep -E 'Mobile(IsRunning|SetDebug)' || true)"
          if [ -n "$final_mobile_undefs" ]; then
            echo "$final_mobile_undefs"
          else
            echo "(none)"
          fi

          # ---------- B. Extension bundle structure ----------
          echo
          echo "=== B. Extension bundle structure ==="
          echo
          echo "--- find $APPEX -maxdepth 4 -print | sort ---"
          find "$APPEX" -maxdepth 4 -print 2>/dev/null | sort || true

          appex_framework_binary="$APPEX/Frameworks/OlcRTCMobile.framework/OlcRTCMobile"
          appex_framework_plist="$APPEX/Frameworks/OlcRTCMobile.framework/Info.plist"
          appex_has_framework_binary=0
          appex_has_framework_plist=0
          if [ -f "$appex_framework_binary" ]; then
            appex_has_framework_binary=1
          fi
          if [ -f "$appex_framework_plist" ]; then
            appex_has_framework_plist=1
          fi
          echo
          echo "--- Embedded framework presence ---"
          echo "Frameworks/OlcRTCMobile.framework/OlcRTCMobile exists: $appex_has_framework_binary"
          echo "Frameworks/OlcRTCMobile.framework/Info.plist exists:  $appex_has_framework_plist"

          # Approximate size impact diagnostic. Pure du; ignore errors
          # because the path may legitimately not exist on
          # FAIL-NOT-EMBEDDED.
          if [ -d "$APPEX/Frameworks/OlcRTCMobile.framework" ]; then
            echo
            echo "--- du -sh on embedded framework ---"
            du -sh "$APPEX/Frameworks/OlcRTCMobile.framework" || true
          fi

          # ---------- C. Main app bundle ----------
          echo
          echo "=== C. Main app bundle (if built) ==="
          if [ -d "$APP" ]; then
            echo "--- find $APP -maxdepth 4 -print | sort ---"
            find "$APP" -maxdepth 4 -print 2>/dev/null | sort || true

            echo
            echo "--- Plugin bundle presence ---"
            if [ -d "$APP/PlugIns/PacketTunnelProvider.appex" ]; then
              echo "$APP/PlugIns/PacketTunnelProvider.appex: present"
              app_has_plugin=1
            else
              echo "$APP/PlugIns/PacketTunnelProvider.appex: MISSING"
              app_has_plugin=0
            fi
          else
            echo "(no $APP — host app not built in this configuration)"
            app_has_plugin=0
          fi

          # `.xcframework` directories must NEVER be copied into a
          # device bundle — Apple's notarization / install code
          # rejects them outright. The host app's framework copy is
          # a `.framework` (the iphoneos slice extracted from the
          # `.xcframework`), and the v10 extension copy should be
          # the same. If we see a literal `.xcframework` directory
          # inside the `.app` or the `.appex`, the embed phase is
          # misconfigured.
          echo
          echo "--- .xcframework leak check ---"
          xcframework_leaks="$( { find "$APP" "$APPEX" -name '*.xcframework' -type d 2>/dev/null || true; } )"
          if [ -n "$xcframework_leaks" ]; then
            echo "WARN: .xcframework directories found in bundle:"
            echo "$xcframework_leaks"
            has_xcframework_leak=1
          else
            echo "(no .xcframework directories inside bundle — OK)"
            has_xcframework_leak=0
          fi

          # ---------- D. Linker command + LTO state ----------
          echo
          echo "=== D. Ld step for PacketTunnelProvider.appex (from xcodebuild log) ==="
          ld_step="(unavailable)"
          if [ -f build/xcodebuild.log ]; then
            ld_step="$(awk '
              /^Ld .*PacketTunnelProvider\.appex\/PacketTunnelProvider normal/ { capture=1; print; next }
              capture==1 && /^[[:space:]]/ { print; next }
              capture==1 { capture=0 }
            ' build/xcodebuild.log || true)"
            echo "$ld_step"
          else
            echo "(xcodebuild.log not present)"
          fi

          compile_has_flto=0
          if [ -f build/xcodebuild.log ] && \
             grep -q -- '-flto=' build/xcodebuild.log; then
            compile_has_flto=1
          fi
          ld_has_object_path_lto=0
          if [ "$ld_step" != "(unavailable)" ] && \
             echo "$ld_step" | grep -q -- '-object_path_lto'; then
            ld_has_object_path_lto=1
          fi
          echo
          echo "--- LTO state ---"
          echo "compile invocations contain -flto=…: $compile_has_flto  (decisive — LTO is actually compiling bitcode)"
          echo "Ld step contains -object_path_lto: $ld_has_object_path_lto  (NOT decisive — Xcode 16.4 passes this regardless of LLVM_LTO)"

          # APPLICATION_EXTENSION_API_ONLY check.
          echo
          echo "--- APPLICATION_EXTENSION_API_ONLY state ---"
          app_ext_api_only_yes=0
          if grep -q "APPLICATION_EXTENSION_API_ONLY: YES" \
             ios/OlcRTCClient/project.yml 2>/dev/null; then
            app_ext_api_only_yes=1
          fi
          echo "APPLICATION_EXTENSION_API_ONLY=YES present in project.yml: $app_ext_api_only_yes"

          # ---------- E. Classification ----------
          echo
          echo "=== E. Result classification ==="
          # v10 primary question: does the `.appex` structurally
          # contain `Frameworks/OlcRTCMobile.framework`? Final
          # `otool -L` for the extension binary is a *secondary*
          # signal — we report it but the probe does not fail just
          # because ld_prime still drops `LC_LOAD_DYLIB`. dyld will
          # resolve the embedded copy at runtime regardless of
          # whether the static load command survives.
          otool_has_olcrtc=0
          if otool -L "$APPEX/PacketTunnelProvider" 2>/dev/null \
              | grep -q "OlcRTCMobile.framework/OlcRTCMobile"; then
            otool_has_olcrtc=1
          fi

          classification=""
          if [ "$app_ext_api_only_yes" -eq 0 ]; then
            classification="FAIL-API-ONLY-OFF"
          elif [ "$has_xcframework_leak" -eq 1 ]; then
            classification="FAIL-XCFRAMEWORK-LEAK"
          elif [ "$appex_has_framework_binary" -eq 0 ] || \
               [ "$appex_has_framework_plist" -eq 0 ]; then
            classification="FAIL-NOT-EMBEDDED"
          elif [ "$otool_has_olcrtc" -eq 1 ]; then
            classification="PASS-LINKED-AND-EMBEDDED"
          else
            classification="PASS-EMBEDDED"
          fi

          echo "classification: $classification"
          echo "  APPLICATION_EXTENSION_API_ONLY=YES: $app_ext_api_only_yes"
          echo "  appex Frameworks/OlcRTCMobile.framework/OlcRTCMobile present: $appex_has_framework_binary"
          echo "  appex Frameworks/OlcRTCMobile.framework/Info.plist present:  $appex_has_framework_plist"
          echo "  otool -L has OlcRTCMobile.framework (secondary):  $otool_has_olcrtc"
          echo "  .xcframework leak inside bundles:                 $has_xcframework_leak"
          echo "  compile invocations contain -flto=…:              $compile_has_flto"
          echo "  Ld step contains -object_path_lto (not decisive): $ld_has_object_path_lto"

          case "$classification" in
            PASS-EMBEDDED|PASS-LINKED-AND-EMBEDDED)
              echo
              echo "OK: PacketTunnelProvider.appex embeds OlcRTCMobile.framework ($classification)."
              ;;
            FAIL-API-ONLY-OFF)
              echo "ERROR: $classification — APPLICATION_EXTENSION_API_ONLY=YES was dropped from project.yml." >&2
              echo "       The probe must keep this enforced; otherwise a 'pass' would not prove extension-API safety." >&2
              exit 1
              ;;
            FAIL-XCFRAMEWORK-LEAK)
              echo "ERROR: $classification — a literal .xcframework directory was copied into the app or appex bundle." >&2
              echo "       Apple's install path rejects .xcframework inside a device bundle." >&2
              echo "       The embed phase should be copying the iphoneos slice (.framework), not the wrapper." >&2
              echo "       Inspect the Copy Files (Embed Frameworks) build phase for PacketTunnelProvider." >&2
              exit 1
              ;;
            FAIL-NOT-EMBEDDED)
              echo "ERROR: $classification — the extension bundle does NOT contain Frameworks/OlcRTCMobile.framework." >&2
              echo "       embed: true in project.yml did not produce a Copy Files (Embed Frameworks) phase," >&2
              echo "       or the phase ran but produced no output, or it produced a different layout." >&2
              echo "       Inspect Section B above and the Ld step in Section D." >&2
              exit 1
              ;;
            *)
              echo "ERROR: $classification — see diagnostics above." >&2
              exit 1
              ;;
          esac

      - name: Probe summary
        if: always()
        run: |
          {
            echo "# Packet Tunnel Gomobile Probe"
            echo
            echo "- **Result:** ${{ job.status }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Ref:** \`${{ github.ref }}\`"
            echo
            echo "## What this probe means"
            echo
            echo "A green run here means the \`PacketTunnelProvider\`"
            echo "extension target compiled and linked against"
            echo "\`OlcRTCMobile.xcframework\` under"
            echo "\`APPLICATION_EXTENSION_API_ONLY = YES\` with code"
            echo "signing disabled."
            echo
            echo "It does **not** mean VPN Mode runtime works. The"
            echo "extension still does not call any \`MobileStart*\`"
            echo "from \`startTunnel\` and still fails fast with"
            echo "\`notWiredYet\`. Real packet routing remains gated"
            echo "on Milestone 4 in \`docs/ROADMAP.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
