name: Bug report (iOS app)
description: A behavior in the iOS client that does not match what the app, the README, or `docs/RELEASE_CHECKLIST.md` says it does.
title: "[bug]: "
labels: ["bug", "ios"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for bugs in the **iOS client** — the SwiftUI app, the `PacketTunnelProvider` extension, the gomobile bridge as consumed from Swift, the unsigned IPA, or the developer-facing build pipeline as observed from a release artifact.

        Bugs in the Go core itself belong upstream:
        <https://github.com/openlibrecommunity/olcrtc/issues>.

        Bugs in the CI pipeline (failing workflows) belong in a `CI failure` issue instead.

        **Never** paste an `olcrtc://` URI, a `keyHex`, a password, or a subscription URL with credentials into this form. Mask before sharing — `LogSanitizer` is on by default in the app's Logs tab, so values you read from the in-app log are already safe.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched open and closed issues and didn't find a duplicate.
          required: true
        - label: I read `docs/RELEASE_CHECKLIST.md` §5 (known limitations) and this bug is not one of the deliberately deferred items.
          required: true
        - label: I will not paste `keyHex`, full `olcrtc://` URIs, passwords, or subscription URLs with credentials into this issue.
          required: true
        - label: This is a bug in the iOS client, not in the upstream Go core under `third_party/olcrtc/`.
          required: true

  - type: input
    id: build
    attributes:
      label: Build / artifact
      description: Commit SHA you are running, or workflow run URL of the IPA artifact you sideloaded.
      placeholder: e.g. https://github.com/artpm4250-png/olcrtc-ios/actions/runs/26597984811
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / iOS version
      description: Real device or simulator? Which iPhone model? Which iOS version?
      placeholder: e.g. iPhone 14 / iOS 17.4, or iPhone 16 Simulator / iOS 18.5 on macOS-latest CI runner
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Local Proxy Mode (wired)
        - VPN Mode (scaffold / stub)
        - Not mode-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, minimal, deterministic.
      placeholder: |
        1. Open Connect, leave all fields empty.
        2. Tap Start.
        3. Expected: Start is disabled. Actual: a runtime error appeared in Logs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt (from the Logs tab)
      description: |
        Paste the relevant section of the in-app Logs tab. The Logs tab already runs every line through `LogSanitizer` before display, so what you copy from there is safe.

        If you must paste any non-Logs-tab output, mask it manually first — anything that looks like a 64-character hex string, an `olcrtc://` URI, or a `key=value` pair where key is `keyHex` / `password` / `pass` / `secret`.
      render: text
    validations:
      required: false
