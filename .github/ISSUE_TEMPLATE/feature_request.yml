name: Feature request (iOS app)
description: A proposed addition or change to the iOS client's behavior, UI, or build pipeline.
title: "[feat]: "
labels: ["enhancement", "ios"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for proposed changes to the **iOS client** — the SwiftUI surface, the gomobile bridge as consumed from Swift, the build pipeline, the unsigned IPA layout, or the CI workflows in this repo.

        Feature requests for the Go core itself belong upstream:
        <https://github.com/openlibrecommunity/olcrtc/issues>.

        Before filing, check whether the request is already covered by a future milestone in [`docs/ROADMAP.md`](https://github.com/artpm4250-png/olcrtc-ios/blob/main/docs/ROADMAP.md). If it is, comment on that milestone's tracking issue instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-flight checklist
      options:
        - label: I read `docs/ROADMAP.md` and this is not a duplicate of a planned milestone.
          required: true
        - label: This is a request for the iOS client, not for the Go core under `third_party/olcrtc/`.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a user do today, or what is harder than it should be?
      placeholder: |
        e.g. "Cannot export a saved profile as an `olcrtc://` URI to share it with another device."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: One paragraph on what you'd add or change. UI sketches in ASCII or screenshots welcome. State explicitly which target (app vs extension) the change affects.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: One or two paragraphs on other approaches and why this one is better.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - UI / UX
        - Profile import / parsing
        - Subscription import
        - Local Proxy Mode
        - VPN Mode / PacketTunnelProvider
        - Logging / privacy
        - Build / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: hard_rules
    attributes:
      label: Hard rules check (`CLAUDE.md`)
      description: Confirm the proposal does not violate the rules in `CLAUDE.md`.
      options:
        - label: This change does **not** require editing the Go core under `third_party/olcrtc/` from this repo.
          required: true
        - label: This change does **not** require shipping UI that pretends VPN Mode works before it is wired.
          required: true
        - label: This change does **not** require logging or persisting raw `keyHex`, `password`, or full `olcrtc://` URIs.
          required: true
